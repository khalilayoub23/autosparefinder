# ISOLATED startup-order repro: exact production backend command, disposable PG, stub app + stub container_start.sh
name: suo
services:
  pg:
    image: postgres:16-alpine
    container_name: suopg
    environment: {POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_USER: autospare, POSTGRES_DB: autospare}
    networks: [suonet]
  backend:
    image: autosparefinder-backend:latest
    container_name: suobackend
    working_dir: /app
    volumes:
      - "${APP_TREE}:/app:ro"
      - "./stub/BACKEND_API_ROUTES.py:/app/BACKEND_API_ROUTES.py:ro"
      - "./stub/container_start.sh:/app/scripts/container_start.sh:ro"
      - "./out:/tmp/out"
    environment:
      PYTHONPATH: /app
      PYTHONDONTWRITEBYTECODE: "1"
      RUNTIME_IDENTITY_DIR: /tmp/ri
      DATABASE_URL: "postgresql+asyncpg://autospare@pg:5432/autospare"
      DATABASE_PII_URL: "postgresql+asyncpg://autospare@pg:5432/autospare_pii"
      PG_DSN_PII: "host=pg user=autospare dbname=autospare_pii"
    command: ["/bin/bash", "-c", "\n  alembic -c alembic.ini upgrade head &&\n  alembic -c alembic_pii.ini upgrade head &&\n  /app/scripts/container_start.sh &\n  uvicorn BACKEND_API_ROUTES:app --host 0.0.0.0 --port 8000 --workers 1\n"]
    restart: unless-stopped
    depends_on: [pg]
    networks: [suonet]
networks:
  suonet: {internal: true}
